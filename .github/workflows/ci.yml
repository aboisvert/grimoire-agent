name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
      - name: Test
        run: |
          nim c --path:src -o:grim-agent src/grim_agent.nim
          nim c -r --path:src --path:tests tests/all_tests.nim
