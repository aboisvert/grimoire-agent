name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: nimlang/nim:2.2.12
    steps:
      - uses: actions/checkout@v7

      - name: Cache Nimble packages
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: nimble-${{ hashFiles('grimoireagent.nimble') }}
          restore-keys: |
            nimble-

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Run tests
        run: nimble test
